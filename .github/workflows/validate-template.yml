name: Validate template

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skills, agents, and config files
        run: python3 .github/scripts/validate_template.py

      - name: Eval — a finished project must validate too
        run: python3 .github/scripts/eval_project_mode.py
